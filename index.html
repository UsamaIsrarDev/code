<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>What can JavaScript do?</h1>

    <img src="./kids.jpeg" alt="shoe" id="img" />

    <button onclick="startSlides()">Show next</button>
    <button onclick="stopSlides()">Stop</button>

    <p id="demo"></p>

    <script>
      const fruits = {
        Banana: 300,
        Apple: 200,
        Orange: 400,
      };

      let result;

      result = JSON.stringify(fruits);

      document.getElementById("demo").innerHTML = result;
    </script>
  </body>
</html>
