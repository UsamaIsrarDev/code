<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>What can JavaScript do?</h1>

    <p id="demo"></p>

    <script>
      const person = new WeakSet();

      const John = { name: "John", age: 40 };
      const Paul = { name: "Paul", age: 41 };
      const Ringo = { name: "Ringo", age: 42 };
      const George = { name: "George", age: 43 };

      let text = "";

      track(Paul);
      track(Ringo);
      track(Paul);

      function track(visitor) {
        if (person.has(visitor)) {
          text += visitor.name + " visits again";
        } else {
          person.add(visitor);
          text += visitor.name + " visit for the first time";
        }
      }

      document.getElementById("demo").innerHTML = text;
    </script>
  </body>
</html>
