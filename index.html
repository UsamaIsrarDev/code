<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>What can JavaScript do?</h1>

    <p id="demo"></p>

    <script>
      function* generatorFunc() {
        yield 1;
        yield 2;

        yield 3;
      }

      const myGenerator = generatorFunc();

      let text = "";

      for (let value of myGenerator) {
        text += value + "<br>";
      }

      const myArr = [12, 15, 34, 56, 76, 86, 90, 45, 16, 37, 89, 67];

      let user = parseInt(prompt("Entern number"));

      if (myArr.includes(user)) {
        console.log("Number is found!", user, "One this index", myArr[user]);
      } else {
        console.log("Number not found!");
      }

      document.getElementById("demo").innerHTML = text;
    </script>
  </body>
</html>
